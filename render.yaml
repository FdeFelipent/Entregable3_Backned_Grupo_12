services:
  - type: web
    name: biocaqueta-app
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.0
      - key: MONGODB_URI
        sync: false
